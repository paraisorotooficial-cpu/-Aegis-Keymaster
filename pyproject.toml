[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-keymaster"
dynamic = ["version"]
description = "Touch-typing tutor for Linux with a cyberpunk neon interface (PySide6)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Aegis Keymaster contributors" }]
dependencies = [
    "PySide6==6.8.3",
]

[project.scripts]
aegis-keymaster = "src.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.dynamic]
version = { attr = "src.__version__.__version__" }

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.data" = ["*.json"]
"src.data.layouts" = ["*.json"]
"src.assets.fonts" = ["*.ttf", "*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = [
    "SIM108",  # ternary is not always clearer
]
allowed-confusables = ["´", "¨", "·", "ª", "º", "—"]

[tool.ruff.lint.per-file-ignores]
"legacy/*" = ["ALL"]
"src/ui/*" = ["N802", "N815"]  # Qt overrides and signals use Qt naming

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["src/core"]
